name: Rotate secrets

on:
  schedule:
    - cron: '17 8 1 * *'   # 08:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: rotate-secrets
  cancel-in-progress: false

env:
  VAULT: kv-arias-6f2a11
  SECRET: goatcounter-admin-password

jobs:
  goatcounter:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubectl and kubelogin
        run: sudo az aks install-cli --only-show-errors

      - name: Connect to AKS
        run: |
          az aks get-credentials -g rg-arias-sh -n aks-arias-sh --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      # 1. New random password goes straight into Key Vault. It is masked in logs and never stored in GitHub.
      - name: Write new password to Key Vault
        run: |
          $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $pw = [Security.Cryptography.RandomNumberGenerator]::GetString($chars, 32)
          "::add-mask::$pw"
          az keyvault secret set --vault-name $env:VAULT -n $env:SECRET --value $pw -o none
          # Keep only a hash so the next step can confirm the sync without handling the password.
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($pw)))
          "PW_HASH=$hash" >> $env:GITHUB_ENV

      # 2. Ask External Secrets to sync now instead of waiting up to an hour, then confirm the new value arrived.
      - name: Sync to Kubernetes
        run: |
          kubectl annotate externalsecret goatcounter-admin -n web force-sync=$(Get-Date -UFormat %s) --overwrite
          foreach ($i in 1..30) {
            $b64 = kubectl get secret goatcounter-admin -n web -o jsonpath='{.data.password}'
            $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Convert]::FromBase64String($b64)))
            if ($hash -eq $env:PW_HASH) { 'Secret synced.'; exit 0 }
            Start-Sleep 5
          }
          throw 'Kubernetes secret did not pick up the new value within 150 seconds.'

      # 3. Restart GoatCounter so its environment holds the new value, then set it as the admin password.
      - name: Apply to GoatCounter
        run: |
          kubectl rollout restart deployment/goatcounter -n web
          kubectl rollout status deployment/goatcounter -n web --timeout=180s
          kubectl exec -n web deploy/goatcounter -- sh -c 'goatcounter db update user -find 1 -password "$GC_ADMIN_PASSWORD"'
          'GoatCounter admin password rotated.'
