name: Kubernetes

on:
  pull_request:
    paths: ['k8s/**', '.github/workflows/k8s.yml']
  push:
    branches: [main]
    paths: ['k8s/**', '.github/workflows/k8s.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: k8s
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubectl and kubelogin
        run: sudo az aks install-cli --only-show-errors

      - name: Connect to AKS
        run: |
          az aks get-credentials -g rg-arias-sh -n aks-arias-sh --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      # The API server validates every manifest (including CRDs like Certificate) without changing anything.
      - name: Validate (server-side dry run)
        run: kubectl apply -f k8s/ --dry-run=server

      - name: Apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: kubectl apply -f k8s/
