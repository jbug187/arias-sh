# External Secrets: the bridge from Azure Key Vault to Kubernetes Secrets.
# ESO signs in with its workload identity (Phase 4) -- no credential is stored anywhere.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-arias-6f2a11.vault.azure.net
---
# Copies the GoatCounter admin password from Key Vault into a Secret in the web namespace,
# re-checking hourly so a rotated value flows through automatically (Phase 8).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: goatcounter-admin
  namespace: web
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: goatcounter-admin
  data:
    - secretKey: password
      remoteRef:
        key: goatcounter-admin-password
