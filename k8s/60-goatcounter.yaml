# GoatCounter analytics at https://stats.arias.sh, with SQLite on a 1 GiB Azure disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goatcounter-data
  namespace: web
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goatcounter
  namespace: web
spec:
  replicas: 1            # SQLite: exactly one writer
  strategy:
    type: Recreate       # stop the old pod before starting the new one (the disk attaches to one pod)
  selector:
    matchLabels: { app: goatcounter }
  template:
    metadata:
      labels: { app: goatcounter }
    spec:
      # Kubernetes injects GOATCOUNTER_PORT=tcp://... for the "goatcounter" Service, which
      # GoatCounter misreads as its own -port flag. Turn those legacy variables off.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # the image's goatcounter user
        runAsGroup: 1000
        fsGroup: 1000        # makes the mounted disk writable by that user
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: goatcounter
          image: arp242/goatcounter:2.7.0
          args: ["serve", "-tls", "http", "-automigrate"]   # Traefik terminates TLS
          env:
            - name: GOATCOUNTER_DB
              value: sqlite+/home/goatcounter/goatcounter-data/db.sqlite3
            # Synced from Key Vault by External Secrets; used when creating/updating the admin login.
            - name: GC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: goatcounter-admin, key: password }
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: data, mountPath: /home/goatcounter/goatcounter-data }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { port: 8080 }
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: goatcounter-data }
---
apiVersion: v1
kind: Service
metadata:
  name: goatcounter
  namespace: web
spec:
  selector: { app: goatcounter }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stats-https
  namespace: web
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`stats.arias.sh`)
      kind: Rule
      middlewares: [{ name: hsts }]
      services: [{ name: goatcounter, port: 80 }]
  tls:
    secretName: arias-tls
