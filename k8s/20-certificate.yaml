# One certificate for all three hostnames. cert-manager renews it ~30 days before expiry.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: arias-tls
  namespace: web
spec:
  secretName: arias-tls
  dnsNames:
    - john.arias.sh
    - arias.sh
    - stats.arias.sh
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod   # switch to letsencrypt-prod once staging succeeds
