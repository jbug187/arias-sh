# The website: nginx serving static files. The pipeline updates the image tag on every
# site change (kubectl set image); kubectl apply leaves that field alone because it
# only patches what changed in this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: web
spec:
  replicas: 2          # two pods so rollouts and node maintenance cause no downtime
  selector:
    matchLabels: { app: site }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: site }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: site
          image: ghcr.io/jbug187/arias-site:latest
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # nginx's pid and temp files
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: web
spec:
  selector: { app: site }
  ports:
    - port: 80
      targetPort: 8080
